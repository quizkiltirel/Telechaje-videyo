<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rechèch Mizik</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface-2:#1f232c; --border:#2a2f3a;
    --text:#e9ebef; --text-dim:#9198a6; --accent:#6c5ce7; --accent-2:#00d4b5; --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 20% -10%, #241f3a 0%, var(--bg) 45%);
    color:var(--text); min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
  header{text-align:center;margin-bottom:28px}
  header h1{font-size:2rem;margin:0 0 6px;font-weight:800;letter-spacing:-0.5px}
  header p{color:var(--text-dim);margin:0;font-size:.95rem}
  nav{display:flex;justify-content:center;gap:10px;margin-bottom:24px}
  nav a{
    text-decoration:none;padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9rem;
    border:1px solid var(--border);
  }
  nav .active{background:var(--accent);color:#fff;border-color:var(--accent)}
  nav a:not(.active){background:var(--surface);color:var(--text-dim)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
  .input-row{display:flex;gap:10px;flex-wrap:wrap}
  input[type=text]{
    flex:1;min-width:220px;padding:14px 16px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-size:1rem;
  }
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  button.primary{
    background:linear-gradient(135deg,var(--accent),#a29bfe);border:none;color:#fff;
    padding:14px 22px;border-radius:10px;font-weight:700;cursor:pointer;font-size:1rem;
  }
  button.primary:disabled{opacity:.5;cursor:not-allowed}
  .error{background:#2b1620;border:1px solid #4a2230;color:#ff9b9b;padding:14px 16px;border-radius:10px;margin-top:16px;font-size:.92rem}
  .result-item{
    display:flex;gap:14px;background:var(--surface-2);border-radius:12px;padding:12px;margin-bottom:10px;
    align-items:center;
  }
  .result-item img{width:120px;height:68px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#000}
  .result-meta{flex:1;min-width:0}
  .result-meta .title{font-weight:700;font-size:.92rem;margin-bottom:4px;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .result-meta .sub{color:var(--text-dim);font-size:.8rem}
  .use-btn{
    background:var(--accent-2);color:#06231e;border:none;border-radius:8px;padding:9px 14px;
    font-weight:700;font-size:.82rem;cursor:pointer;white-space:nowrap;text-decoration:none;
  }
  .empty{text-align:center;color:var(--text-dim);padding:30px 10px;font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rechèch Mizik</h1>
    <p>Vrè rezilta YouTube — chwazi youn epi ale telechaje l</p>
  </header>

  <nav>
    <a href="/">Telechajman</a>
    <a href="/search" class="active">Rechèch Mizik</a>
  </nav>

  <div class="card">
    <div class="input-row">
      <input id="queryInput" type="text" placeholder="Chache yon chan, atis, oswa videyo...">
      <button class="primary" id="searchBtn">Chache</button>
    </div>
    <div id="errorBox"></div>
  </div>

  <div id="resultsCard" class="card" style="display:none">
    <div id="resultsList"></div>
  </div>
</div>

<script>
const $ = sel => document.querySelector(sel);
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; }
function showError(msg){ $('#errorBox').innerHTML = msg ? `<div class="error">${escapeHtml(msg)}</div>` : ''; }

async function search(){
  const query = $('#queryInput').value.trim();
  showError('');
  $('#resultsCard').style.display = 'none';
  if(!query){ showError('Tanpri antre yon rechèch'); return; }

  const btn = $('#searchBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Ap chache...';

  try{
    const res = await fetch('/api/search', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({query})
    });
    const data = await res.json();
    if(!res.ok){
      showError(data.error || 'Pwoblèm nan rechèch la');
      return;
    }
    renderResults(data.results || []);
  } catch(e){
    showError('Pwoblèm koneksyon ak sèvè a.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Chache';
  }
}

function renderResults(results){
  $('#resultsCard').style.display = 'block';
  if(!results.length){
    $('#resultsList').innerHTML = `<div class="empty">Pa gen rezilta pou rechèch sa a.</div>`;
    return;
  }
  $('#resultsList').innerHTML = results.map(r => `
    <div class="result-item">
      <img src="${escapeHtml(r.thumbnail)}" alt="" loading="lazy" onerror="this.style.display='none'">
      <div class="result-meta">
        <div class="title">${escapeHtml(r.title)}</div>
        <div class="sub">${escapeHtml(r.channel)} ${r.duration ? '· '+escapeHtml(r.duration) : ''} ${r.views ? '· '+escapeHtml(r.views)+' vizyonaj' : ''}</div>
      </div>
      <a class="use-btn" href="/?url=${encodeURIComponent(r.url)}" onclick="localStorage.setItem('lastUrl','${r.url}')">Telechaje</a>
    </div>`).join('');
}

$('#searchBtn').addEventListener('click', search);
$('#queryInput').addEventListener('keypress', e => { if(e.key === 'Enter') search(); });
</script>
</body>
</html>
